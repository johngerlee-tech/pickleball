<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>溪洲國小匹克球樂活俱樂部登記系統</title>
  
  <style>
    /* 清除邊界，讓 iframe 完整佔滿整個視窗 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }

    /* 滿版容器 */
    .gas-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* iframe 完全對齊頂部，不再向上位移，保留完整的頂部按鈕列 */
    .gas-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="gas-wrapper">
    <iframe 
      id="gasFrame"
      src="https://script.google.com/macros/s/AKfycbyuZbgkZzZ9Upj9P_gXZoWKla87rePlmu5bIA0NV4GuBS69gDJAdsSOXLZlZed3vtHJ/exec"
      allow="clipboard-write"
      loading="lazy">
    </iframe>
  </div>

  <script>
    // 參數透傳機制：掃描帶有 ?action=checkin 的 QR Code 時自動傳入 iframe
    (function forwardUrlParams() {
      const currentSearch = window.location.search;
      if (currentSearch) {
        const frame = document.getElementById('gasFrame');
        const baseUrl = frame.src.split('?')[0];
        frame.src = baseUrl + currentSearch;
      }
    })();
  </script>

</body>
</html>
